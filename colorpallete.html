<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* Apply Poppins font to the body */
        }
        img {
            max-width: 500px; /* Set the maximum width for images */
            width: 100%; /* Ensure images are responsive */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>
    <h1>Color Palette</h1>
    <div>
        <h2>Gradient Image</h2>
        <img src="images/gradient.png" alt="Gradient Image">
    </div>
    <div>
        <h2>Regular Image</h2>
        <img src="images/regular.png" alt="Regular Image">
    </div>
</body>
</html>
