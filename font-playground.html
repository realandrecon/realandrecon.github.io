<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Font Playground — Auto Load</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#60a5fa}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#071027 0%, #071727 100%);color:#e6eef6}
    .wrap{max-width:1200px;margin:18px auto;padding:16px}
    h1{margin:0 0 8px;font-size:20px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    input[type=text]{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px;border-radius:8px;color:inherit;flex:1}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
    .font-card{background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.00));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.02)}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .name{font-weight:700}
    .sample{font-size:28px;line-height:1.05;min-height:56px}
    .muted{color:var(--muted);font-size:13px}
    .actions{display:flex;gap:6px;margin-top:8px}
    a.download{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 8px;border-radius:8px;color:inherit;text-decoration:none}
    button.load-more{background:var(--accent);border:none;padding:8px 12px;border-radius:8px;color:#072032;cursor:pointer;margin:12px auto;display:block}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Font Playground — Auto Load</h1>
    <div class="controls">
      <input id="sampleText" type="text" value="The quick brown fox jumps over the lazy dog" placeholder="Sample text…" />
      <label class="muted">Size:</label>
      <input id="sizeRange" type="range" min="12" max="120" value="28" />
      <div id="sizeVal" class="muted">28px</div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="status" class="muted">Loading fonts…</div>
  </div>

<script>
(async () => {
  const username = 'realandrecon';
  const repo = 'realandrecon.github.io';
  const path = 'fonts';
  const batchSize = 25;

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const sampleText = document.getElementById('sampleText');
  const sizeRange = document.getElementById('sizeRange');
  const sizeVal = document.getElementById('sizeVal');

  sizeRange.addEventListener('input', ()=>{ sizeVal.textContent = sizeRange.value+'px'; updateSamples(); });
  sampleText.addEventListener('input', updateSamples);

  function updateSamples(){
    document.querySelectorAll('.sample').forEach(el=>{
      el.textContent = sampleText.value;
      el.style.fontSize = sizeRange.value+'px';
    });
  }

  async function fetchFonts(){
    try {
      const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}`);
      if(!res.ok) throw new Error('GitHub API error');
      const data = await res.json();
      return data.filter(f=>f.type==='file' && /\.(ttf|otf|woff2?|woff)$/i.test(f.name));
    } catch(e){
      console.error(e);
      status.textContent='Failed to load fonts';
      return [];
    }
  }

  async function registerFont(url,name){
    const family = 'FF_'+name.replace(/\W/g,'_');
    const fontFace = new FontFace(family,`url(${url})`);
    await fontFace.load();
    document.fonts.add(fontFace);
    return family;
  }

  function makeCard(name,family,url){
    const card=document.createElement('div'); card.className='font-card';
    const meta=document.createElement('div'); meta.className='meta'; meta.textContent=name;
    const sample=document.createElement('div'); sample.className='sample'; sample.textContent=sampleText.value;
    sample.style.fontFamily=family; sample.style.fontSize=sizeRange.value+'px';
    const actions=document.createElement('div'); actions.className='actions';
    const dl=document.createElement('a'); dl.className='download'; dl.href=url; dl.download=name; dl.textContent='Download';
    actions.appendChild(dl); card.append(meta,sample,actions);
    return card;
  }

  let fonts = await fetchFonts();
  let loaded = 0;

  function renderBatch(){
    const batch = fonts.slice(loaded,loaded+batchSize);
    if(batch.length===0) return;
    batch.forEach(async f=>{
      const rawUrl=`https://raw.githubusercontent.com/${username}/${repo}/main/${path}/${encodeURIComponent(f.name)}`;
      const family=await registerFont(rawUrl,f.name);
      grid.appendChild(makeCard(f.name,family,rawUrl));
    });
    loaded+=batch.length;
    status.textContent=`Loaded ${loaded}/${fonts.length} fonts`;
    if(loaded<fonts.length){
      let btn=document.getElementById('loadMoreBtn');
      if(!btn){
        btn=document.createElement('button'); btn.id='loadMoreBtn'; btn.className='load-more'; btn.textContent='Load more';
        btn.onclick=()=>{ renderBatch(); btn.remove(); if(loaded<fonts.length) renderLoadMore(); };
        grid.parentNode.appendChild(btn);
      }
    }
  }

  function renderLoadMore(){
    let btn=document.getElementById('loadMoreBtn');
    if(!btn){
      btn=document.createElement('button'); btn.id='loadMoreBtn'; btn.className='load-more'; btn.textContent='Load more';
      btn.onclick=()=>{ renderBatch(); btn.remove(); if(loaded<fonts.length) renderLoadMore(); };
      grid.parentNode.appendChild(btn);
    }
  }

  renderBatch();
})();
</script>
</body>
</html>
