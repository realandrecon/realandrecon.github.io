<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Font Playground</title>
  <style>
    :root{--bg:#0f1724;--accent:#60a5fa;--muted:#9aa4b2}
    html, body {margin:0;padding:0;height:100%;font-family:system-ui;background:#071027;color:#e6eef6;}
    .wrap {max-width:1200px;margin:18px auto;padding:16px;}
    h1 {margin:0 0 8px;font-size:24px;}
    .controls {display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    input[type=text], textarea {background:transparent;border:1px solid rgba(255,255,255,0.2);padding:8px;border-radius:6px;color:inherit;}
    .grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px;}
    .font-card {background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;}
    .meta {font-weight:700;margin-bottom:8px;}
    .sample {font-size:28px;line-height:1.1;min-height:56px;}
    .actions {margin-top:8px;}
    .download {background:var(--accent);color:#072032;padding:6px 10px;border:none;border-radius:6px;text-decoration:none;}
    .muted {color:var(--muted);}
    #status {margin-top:12px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Font Playground (made with GPT cuz I'm lazy)</h1>
    <div class="controls">
      <input id="sampleText" type="text" value="The quick brown fox jumps over the lazy dog" placeholder="Sample text…">
      <label class="muted">Size:</label>
      <input id="sizeRange" type="range" min="12" max="120" value="28">
      <div id="sizeVal" class="muted">28px</div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="status" class="muted">Loading fonts…</div>
  </div>

  <script>
    (async () => {
      const username = 'realandrecon';
      const repo = 'realandrecon.github.io';
      const path = 'fonts';

      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      const sampleText = document.getElementById('sampleText');
      const sizeRange = document.getElementById('sizeRange');
      const sizeVal = document.getElementById('sizeVal');

      sizeRange.addEventListener('input', () => {
        sizeVal.textContent = sizeRange.value + 'px';
        updateSamples();
      });
      sampleText.addEventListener('input', updateSamples);

      function updateSamples() {
        document.querySelectorAll('.sample').forEach(el => {
          el.textContent = sampleText.value;
          el.style.fontSize = sizeRange.value + 'px';
        });
      }

      async function fetchFontsList() {
        try {
          const res = await fetch(apiUrl);
          if (!res.ok) throw new Error('GitHub API error');
          const data = await res.json();
          return data.filter(item => {
            return item.type === 'file' && /\.(ttf|otf|woff2?|woff)$/i.test(item.name);
          });
        } catch (e) {
          console.error(e);
          status.textContent = 'Failed to load font list';
          return [];
        }
      }

      async function registerFont(fontUrl, family) {
        const fontFace = new FontFace(family, `url(${fontUrl})`);
        await fontFace.load();
        document.fonts.add(fontFace);
      }

      function makeCard(name, family, url) {
        const card = document.createElement('div');
        card.className = 'font-card';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = name;

        const sample = document.createElement('div');
        sample.className = 'sample';
        sample.textContent = sampleText.value;
        sample.style.fontFamily = family;
        sample.style.fontSize = sizeRange.value + 'px';

        const actions = document.createElement('div');
        actions.className = 'actions';
        const dl = document.createElement('a');
        dl.className = 'download';
        dl.href = url;
        dl.download = name;
        dl.textContent = 'Download';
        actions.appendChild(dl);

        card.append(meta, sample, actions);
        return card;
      }

      async function init() {
        const fonts = await fetchFontsList();
        if (fonts.length === 0) {
          status.textContent = 'No fonts found in /fonts/';
          return;
        }

        let loaded = 0;
        for (const f of fonts) {
          const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${path}/${encodeURIComponent(f.name)}`;
          const fam = `Font_${f.name.replace(/\\W/g, '_')}_${loaded}`;
          await registerFont(rawUrl, fam);
          const card = makeCard(f.name, fam, rawUrl);
          grid.appendChild(card);
          loaded++;
        }
        status.textContent = `Loaded ${loaded} fonts`;
      }

      await init();
    })();
  </script>
</body>
</html>
